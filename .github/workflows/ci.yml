name: CI

on:
  push:
    branches: [main]

jobs:
  calidad:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Comprobar el estilo con ESLint
        run: npm run lint

      - name: Comprobar el formato con Prettier
        run: npx prettier --check .

      - name: Ejecutar los tests
        run: npx vitest run

      - name: Compilar para producción
        run: npm run build
